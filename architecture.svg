<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">Terraformで構築するAWS Web環境（SSM構成）</title>
  <desc id="description">Internet GatewayとHTTP ALBを入口に、2つのアベイラビリティゾーンのプライベートサブネットにあるWebサーバーへ接続する構成。各WebサブネットはそれぞれのNAT Gatewayから外部へ接続し、RDSはus-east-1cのプライベートサブネットに1台配置。EC2管理にはSystems Manager Session Managerを使用。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#52647a"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2474c6"/>
    </marker>
    <style>
      text { font-family: "Yu Gothic", "Meiryo", sans-serif; fill: #172b4d; }
      .title { font-size: 25px; font-weight: 700; }
      .subtitle { font-size: 13px; fill: #52647a; }
      .boundary { fill: #f8fafc; stroke: #52647a; stroke-width: 2; }
      .vpc { fill: #fff; stroke: #8797aa; stroke-width: 2; }
      .public { fill: #fff8e7; stroke: #e6a700; stroke-width: 1.5; }
      .private { fill: #edf6ff; stroke: #5b9bd5; stroke-width: 1.5; }
      .database { fill: #f4efff; stroke: #8b70cf; stroke-width: 1.5; }
      .zone-info { fill: #f3f6fa; stroke: #c5ced8; stroke-width: 1.5; }
      .zone { font-size: 14px; font-weight: 700; }
      .subnet-title { font-size: 13px; font-weight: 700; }
      .node { fill: #fff; stroke: #a7b3c2; stroke-width: 1.5; }
      .node-title { font-size: 14px; font-weight: 700; }
      .node-note { font-size: 11px; fill: #52647a; }
      .small { font-size: 12px; }
      .edge { fill: none; stroke: #52647a; stroke-width: 2; marker-end: url(#arrow); }
      .edge-blue { fill: none; stroke: #2474c6; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrowBlue); }
      .edge-label { font-size: 11px; fill: #52647a; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#fff"/>
  <text x="34" y="42" class="title">Terraformで構築する AWS Web 環境（SSM構成）</text>
  <text x="35" y="66" class="subtitle">リージョン：us-east-1　｜　Web：HTTP :80　｜　EC2管理：AWS Systems Manager Session Manager</text>

  <rect x="28" y="88" width="1144" height="642" rx="16" class="boundary"/>
  <text x="48" y="117" class="node-title">AWS Cloud</text>
  <text x="145" y="117" class="small">リージョン：us-east-1</text>
  <rect x="48" y="132" width="1104" height="578" rx="13" class="vpc"/>
  <text x="68" y="160" class="node-title">VPC（10.11.0.0/16）</text>

  <rect x="224" y="177" width="262" height="136" rx="10" class="public"/>
  <text x="242" y="201" class="zone">アベイラビリティゾーン us-east-1a</text>
  <text x="242" y="224" class="subnet-title">パブリックサブネット</text>
  <rect x="264" y="237" width="180" height="58" rx="8" class="node"/>
  <text x="354" y="260" text-anchor="middle" class="node-title">NAT Gateway A</text>
  <text x="354" y="279" text-anchor="middle" class="node-note">外向き通信</text>

  <rect x="514" y="177" width="262" height="136" rx="10" class="public"/>
  <text x="532" y="201" class="zone">アベイラビリティゾーン us-east-1b</text>
  <text x="532" y="224" class="subnet-title">パブリックサブネット</text>
  <rect x="554" y="237" width="180" height="58" rx="8" class="node"/>
  <text x="644" y="260" text-anchor="middle" class="node-title">NAT Gateway B</text>
  <text x="644" y="279" text-anchor="middle" class="node-note">外向き通信</text>

  <rect x="804" y="177" width="300" height="136" rx="10" class="zone-info"/>
  <text x="822" y="201" class="zone">アベイラビリティゾーン us-east-1c</text>
  <text x="822" y="235" class="subnet-title">RDS 用サブネットのみ配置</text>
  <text x="822" y="263" class="node-note">パブリックサブネットは作成しません</text>

  <rect x="374" y="331" width="436" height="72" rx="11" fill="#eaf3ff" stroke="#2474c6" stroke-width="2"/>
  <text x="592" y="360" text-anchor="middle" class="node-title">Application Load Balancer（ALB）</text>
  <text x="592" y="382" text-anchor="middle" class="node-note">パブリックサブネットに配置・HTTP :80 を受付</text>

  <rect x="224" y="428" width="262" height="171" rx="10" class="private"/>
  <text x="242" y="452" class="zone">プライベートサブネット A</text>
  <rect x="254" y="470" width="202" height="79" rx="8" class="node"/>
  <text x="355" y="497" text-anchor="middle" class="node-title">Web サーバー A</text>
  <text x="355" y="519" text-anchor="middle" class="node-note">EC2 / Apache / PHP</text>
  <text x="355" y="538" text-anchor="middle" class="node-note">SSM 管理対象インスタンス</text>
  <text x="242" y="579" class="node-note">デフォルトルート → NAT Gateway A</text>

  <rect x="514" y="428" width="262" height="171" rx="10" class="private"/>
  <text x="532" y="452" class="zone">プライベートサブネット B</text>
  <rect x="544" y="470" width="202" height="79" rx="8" class="node"/>
  <text x="645" y="497" text-anchor="middle" class="node-title">Web サーバー B</text>
  <text x="645" y="519" text-anchor="middle" class="node-note">EC2 / Apache / PHP</text>
  <text x="645" y="538" text-anchor="middle" class="node-note">SSM 管理対象インスタンス</text>
  <text x="532" y="579" class="node-note">デフォルトルート → NAT Gateway B</text>

  <rect x="804" y="428" width="300" height="171" rx="10" class="database"/>
  <text x="822" y="452" class="zone">RDS 用プライベートサブネット</text>
  <rect x="854" y="470" width="200" height="79" rx="8" class="node"/>
  <text x="954" y="497" text-anchor="middle" class="node-title">Amazon RDS for MySQL</text>
  <text x="954" y="519" text-anchor="middle" class="node-note">単一インスタンス / MySQL 8.0</text>
  <text x="954" y="538" text-anchor="middle" class="node-note">Public access：無効</text>
  <text x="822" y="579" class="node-note">配置 AZ：us-east-1c / 外部向け経路なし</text>

  <rect x="68" y="218" width="132" height="58" rx="9" class="node"/>
  <text x="134" y="243" text-anchor="middle" class="node-title">利用者</text>
  <text x="134" y="262" text-anchor="middle" class="node-note">Web ブラウザー</text>
  <rect x="68" y="322" width="132" height="58" rx="9" class="node"/>
  <text x="134" y="347" text-anchor="middle" class="node-title">Internet Gateway</text>
  <text x="134" y="366" text-anchor="middle" class="node-note">VPC に接続</text>

  <path d="M134 276 V316" class="edge"/>
  <path d="M200 351 H338 V367 H368" class="edge"/>
  <text x="231" y="341" class="edge-label">HTTP</text>
  <path d="M510 403 V416 H355 V464" class="edge"/>
  <path d="M674 403 V416 H645 V464" class="edge"/>
  <path d="M456 510 H844" class="edge"/>
  <path d="M746 510 H844" class="edge"/>
  <text x="766" y="496" class="edge-label">MySQL :3306</text>

  <path d="M264 504 H238 V313 H300 V301" class="edge-blue"/>
  <path d="M554 564 H496 V313 H678 V301" class="edge-blue"/>

  <rect x="224" y="625" width="880" height="55" rx="9" fill="#f3f6fa" stroke="#c5ced8"/>
  <text x="244" y="649" class="small">管理経路：管理者 → Systems Manager Session Manager → EC2（SSH :22 は許可しない）</text>
  <text x="244" y="669" class="node-note">RDS の DB subnet group は複数 AZ のサブネットを含みますが、RDS インスタンスは us-east-1c に 1 台作成します。</text>
</svg>
